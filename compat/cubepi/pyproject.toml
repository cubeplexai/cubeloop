[project]
name = "cubepi"
version = "0.15.1"
description = "REMOVED: Install cubeloop and migrate imports from cubepi."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
cubepi = "cubepi.__main__:main"

[project.urls]
Homepage = "https://cubeloop.dev"
Documentation = "https://cubeloop.dev/docs/migration/from-cubepi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubepi"]
